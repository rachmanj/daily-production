services:
  app:
    build: .
    container_name: mineops-app
    restart: unless-stopped
    ports: ["3005:80"]
    environment:
      - APP_NAME=MineOps
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://100.77.117.2:3005
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=mineops
      - DB_USERNAME=mineops
      - DB_PASSWORD=${DB_PASSWORD:-mineops_secret_2026}
    volumes: [app_storage:/var/www/storage]
    depends_on: { mysql: { condition: service_healthy } }
    networks: [mineops-network]

  mysql:
    image: mysql:8.4
    container_name: mineops-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_secret_2026
      - MYSQL_DATABASE=mineops
      - MYSQL_USER=mineops
      - MYSQL_PASSWORD=mineops_secret_2026
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck: { test: ["CMD","mysqladmin","ping","-h","localhost"], interval: 10s, timeout: 5s, retries: 5 }
    networks: [mineops-network]

volumes:
  app_storage:
  mysql_data:

networks:
  mineops-network: { driver: bridge }